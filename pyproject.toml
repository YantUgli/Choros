[project]
name = "choros"
version = "0.2.0"
description = "Orchestrator langganan coding-agent yang legit dan self-hosted"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
lint.select = ["E4", "E7", "E9", "F", "BLE", "S", "SIM"]
lint.ignore = [
    "BLE001", # jalur pembersihan best-effort dan parser yang tidak boleh menjatuhkan run
    "S110",   # jalur pembersihan best-effort dan parser yang tidak boleh menjatuhkan run
    "SIM102", # adapter
    "SIM117", # adapter
    "S101",   # disengaja untuk assert di test / adapter
    "S105",   # hardcoded password dummy
    "SIM105", # try-except-pass yang valid
]

[tool.ruff.lint.per-file-ignores]
# Ruleset bandit ditujukan untuk kode produksi, bukan test: password fixture,
# path /tmp yang cuma diparse, dan pemanggilan `git` semuanya disengaja di sini.
# F401 sengaja TIDAK dikecualikan — impor menganggur di test tetap sampah.
"tests/**" = ["S"]
